name: FarmandehAI Research

on:
  workflow_dispatch:
    inputs:
      research_days:
        description: "Historical research window in days"
        required: false
        default: "180"
      mc_simulations:
        description: "Monte Carlo simulations"
        required: false
        default: "1000"

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PAPER: "true"
      LIVE: "false"
      REAL: "false"
      RESEARCH_DAYS: ${{ inputs.research_days }}
      MC_SIMULATIONS: ${{ inputs.mc_simulations }}
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Safety and secret preflight
        shell: bash
        run: |
          set -euo pipefail
          test "${PAPER}" = "true"
          test "${LIVE}" = "false"
          test "${REAL}" = "false"
          test -n "${TWELVEDATA_API_KEY}" || { echo "TWELVEDATA_API_KEY GitHub secret is missing"; exit 1; }

      - name: Compile
        run: python -m compileall -q .

      - name: Tests
        run: python -m pytest -q

      - name: Run 180-day research
        run: python -u holdout_runner.py

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: farmandehai-validation-${{ github.run_id }}
          path: |
            artifacts/validation.json
            artifacts/checkpoints/**
          if-no-files-found: warn
