name: FarmandehAI Research

on:
  workflow_dispatch:
    inputs:
      research_days:
        description: "Historical research window in days"
        required: false
        default: "180"
      mc_simulations:
        description: "Monte Carlo simulations"
        required: false
        default: "1000"
  push:
    branches: [main]

jobs:
  research:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-research]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PAPER: "true"
      LIVE: "false"
      REAL: "false"
      RESEARCH_DAYS: ${{ inputs.research_days || '180' }}
      MC_SIMULATIONS: ${{ inputs.mc_simulations || '1000' }}
      RESEARCH_DATA_URL: "https://raw.githubusercontent.com/getdata-finance/gbpusd-5m-ohlcv-forex-historical-data/main/GBPUSD_5m.csv"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Safety preflight
        shell: bash
        run: |
          set -euo pipefail
          test "${PAPER}" = "true"
          test "${LIVE}" = "false"
          test "${REAL}" = "false"
          test -n "${RESEARCH_DATA_URL}"
      - name: Compile
        run: python -m compileall -q .
      - name: Tests
        run: python -m pytest -q
      - name: Run 180-day research
        run: python -u holdout_runner.py
      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: farmandehai-validation-${{ github.run_id }}
          path: |
            artifacts/validation.json
            artifacts/checkpoints/**
          if-no-files-found: warn
